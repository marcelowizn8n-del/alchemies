services:
  alchemies-web:
    image: nginx:1.27-alpine
    container_name: alchemies-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ALCHEMIES_HOST_PORT:-8090}:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - npm_proxy

networks:
  npm_proxy:
    external: true
    name: ${NPM_NETWORK}
