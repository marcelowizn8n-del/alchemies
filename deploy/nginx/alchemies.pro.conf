server {
    listen 80;
    listen [::]:80;
    server_name alchemies.pro www.alchemies.pro;

    root /var/www/alchemies.pro/current;
    index index.html;

    access_log /var/log/nginx/alchemies.pro.access.log;
    error_log /var/log/nginx/alchemies.pro.error.log;

    client_max_body_size 32m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|pdf|mp4|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
