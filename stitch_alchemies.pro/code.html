<style>
    body {
      background-color: #0e0e0e;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }
    .glass-card {
      background: rgba(38, 38, 38, 0.6);
      backdrop-filter: blur(20px);
    }
    .primary-gradient {
      background: linear-gradient(135deg, #ba9eff 0%, #8455ef 100%);
    }
    .void-glow {
      position: absolute;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(57, 0, 140, 0.15) 0%, rgba(14, 14, 14, 0) 70%);
      filter: blur(80px);
      z-index: -1;
    }
  </style>

<body class="min-h-screen flex flex-col justify-center items-center relative overflow-hidden">
<!-- Ambient Background Textures -->
<div class="void-glow top-[-10%] left-[-10%]"></div>
<div class="void-glow bottom-[-10%] right-[-10%]"></div>
<div class="absolute inset-0 z-[-2] opacity-20" data-alt="abstract neural network texture with faint luminous connections on a pitch black background">
<div class="w-full h-full bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]"></div>
</div>
<main class="w-full max-w-md px-6 z-10">
<!-- Brand Header -->
<div class="text-center mb-10">
<h1 class="text-3xl font-extrabold tracking-tighter text-primary mb-2">Aether Void</h1>
<p class="text-on-surface-variant text-sm font-label tracking-wide">THE DIGITAL ALCHEMIST INTERFACE</p>
</div>
<!-- Auth Card -->
<div class="glass-card rounded-xl p-8 shadow-[0_20px_40px_rgba(57,0,140,0.05)] border border-outline-variant/15">
<!-- Tab Toggle -->
<div class="flex justify-center mb-8 p-1 bg-surface-container-lowest rounded-full w-fit mx-auto">
<button class="px-6 py-2 text-xs font-bold rounded-full bg-surface-bright text-on-surface transition-all duration-300">Login</button>
<button class="px-6 py-2 text-xs font-bold rounded-full text-on-surface-variant hover:text-on-surface transition-all duration-300">Sign Up</button>
</div>
<form class="space-y-6">
<!-- Input Groups -->
<div class="space-y-4">
<div class="group">
<label class="block text-[10px] uppercase tracking-[0.05em] font-label text-on-surface-variant mb-1.5 ml-1">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">mail</span>
<input class="w-full bg-surface-container-lowest border-none rounded-md py-3.5 pl-11 pr-4 text-sm text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary/40 transition-all duration-300" placeholder="alchemist@aether.void" type="email"/>
</div>
</div>
<div class="group">
<div class="flex justify-between items-center mb-1.5 ml-1">
<label class="text-[10px] uppercase tracking-[0.05em] font-label text-on-surface-variant">Password</label>
<a class="text-[10px] uppercase tracking-[0.05em] font-label text-primary hover:text-primary-dim transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">lock</span>
<input class="w-full bg-surface-container-lowest border-none rounded-md py-3.5 pl-11 pr-4 text-sm text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary/40 transition-all duration-300" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<!-- Submit Button -->
<button class="w-full primary-gradient text-on-primary py-3.5 rounded-xl font-bold text-sm tracking-wide shadow-[0_10px_20px_rgba(186,158,255,0.2)] hover:scale-[1.02] active:scale-[0.98] transition-all duration-300" type="submit">
          Sign In
        </button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-outline-variant/15"></div></div>
<div class="relative flex justify-center text-[10px] uppercase tracking-widest"><span class="bg-[#262626] px-4 text-on-surface-variant">Or continue with</span></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-3 px-4 bg-surface-container-highest rounded-xl hover:bg-surface-bright transition-colors duration-300">
<svg class="w-4 h-4" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-xs font-bold">Google</span>
</button>
<button class="flex items-center justify-center gap-2 py-3 px-4 bg-surface-container-highest rounded-xl hover:bg-surface-bright transition-colors duration-300">
<svg class="w-4 h-4 text-white" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.042-1.416-4.042-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"></path>
</svg>
<span class="text-xs font-bold">GitHub</span>
</button>
</div>
</div>
<!-- Additional Links -->
<div class="mt-12 text-center">
<p class="text-[10px] uppercase tracking-[0.1em] text-on-surface-variant/60 font-label">
        By continuing, you agree to the 
        <a class="text-on-surface-variant hover:text-primary underline decoration-primary/30 transition-colors" href="#">Terms of Alchemy</a>
</p>
</div>
</main>
<!-- Footer Navigation Anchor -->
<footer class="w-full py-12 absolute bottom-0">
<div class="flex flex-col md:flex-row justify-between items-center px-8 max-w-7xl mx-auto gap-4 border-t border-[#494847]/15 pt-8">
<p class="text-[10px] uppercase tracking-[0.05em] font-['Inter'] text-[#adaaaa]">© 2024 Aether Void. Created by Digital Alchemists.</p>
<div class="flex gap-8">
<a class="text-[10px] uppercase tracking-[0.05em] font-['Inter'] text-[#adaaaa] hover:text-[#ba9eff] transition-colors" href="#">Privacy</a>
<a class="text-[10px] uppercase tracking-[0.05em] font-['Inter'] text-[#adaaaa] hover:text-[#ba9eff] transition-colors" href="#">Terms</a>
<a class="text-[10px] uppercase tracking-[0.05em] font-['Inter'] text-[#adaaaa] hover:text-[#ba9eff] transition-colors" href="#">Security</a>
</div>
</div>
</footer>
</body></html>
